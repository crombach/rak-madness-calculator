<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- viewport-fit=cover is what makes the safe-area insets non-zero, which
         Table.scss uses to size the row below the scores.

         interactive-widget=resizes-content hands a keyboard's height back to the
         layout viewport, so the dialog sheet's `bottom: 0`, every `dvh`, and Base
         UI's own idea of the room a popup has are all the screen the reader can
         see. Measuring that instead left the search behind the keyboard wherever
         the measurement was wrong, which on Firefox for Android is always: it
         shrinks the layout viewport, so `window.innerHeight` drops with the visual
         viewport and the two report no keyboard at all.

         It costs the rotate overlay a guard. A small phone with a keyboard up is
         wider than it is tall, which reads as landscape; `phone-landscape` in
         src/styles/_breakpoints.scss holds it off with an aspect ratio.

         src/hooks/useViewportInsets.ts stays for iOS Safari, which ignores this. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Matches --rak-primary-500 in src/index.scss, the navbar's own fill. -->
    <meta name="theme-color" content="#4f4f4f" />
    <meta name="description" content="Auto-scorer for Rak Madness" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developer.mozilla.org/en-US/docs/Web/Progressive_web_apps/Manifest
    -->
    <link rel="manifest" href="/manifest.json" />
    <title>Rakulator</title>
    <!-- The saved theme, before the first paint. src/context/SettingsContext.tsx
         sets the same attribute once React is up, which is too late: a reader who
         chose dark on a light OS would see a light flash on every load. The key is
         the one src/utils/settingsStore.ts writes. -->
    <script>
      try {
        var theme = localStorage.getItem("rak-madness:settings:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // A browser refusing storage has no saved theme to honour anyway.
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
