<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- viewport-fit=cover is what makes the safe-area insets non-zero, which
         Table.scss uses to size the row below the scores.

         interactive-widget=resizes-content hands a keyboard's height back to the
         layout viewport, so the dialog sheet's `bottom: 0`, every `dvh`, and Base
         UI's own idea of the room a popup has are all the screen the reader can
         see. Measuring that instead left the search behind the keyboard wherever
         the measurement was wrong, which on Firefox for Android is always the
         case. It shrinks the layout viewport, so `window.innerHeight` drops with
         the visual viewport and the two report no keyboard at all.

         It costs the rotate overlay a guard. A small phone with a keyboard up is
         wider than it is tall, which reads as landscape. `phone-landscape` in
         src/styles/_breakpoints.scss holds it off with an aspect ratio.

         src/hooks/useViewportInsets.ts stays for iOS Safari, which ignores this. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Matches --rak-primary-500 in src/index.scss, the navbar's own fill. -->
    <meta name="theme-color" content="#4f4f4f" />
    <meta name="description" content="Auto-scorer for Rak Madness" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developer.mozilla.org/en-US/docs/Web/Progressive_web_apps/Manifest
    -->
    <link rel="manifest" href="/manifest.json" />
    <title>Rakulator</title>
    <!-- The two faces that paint before anything else, declared here so the fetch
         starts while the HTML is still parsing. Every other font in this app is
         reached through src/index.tsx, which imports the @fontsource stylesheet
         that declares it. Nothing asks for those files until that bundle has
         loaded and run, so their text paints in a fallback and swaps once the real
         face lands.

         The logo is a wordmark drawn as a segment display, and that swap is the
         whole logo changing shape. The body face is narrower than the system stack
         behind it, so its swap moves every label that was measured in the fallback.
         The navbar's right group is sized to its content and sits against the right
         edge, which makes it the clearest place to see it.

         Copies at fixed paths under public/, not the hashed ones Vite emits from
         node_modules, since this file cannot know those names. public/CLAUDE.md
         says where they came from. -->
    <link
      rel="preload"
      href="/fonts/dseg14-classic-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/chakra-petch-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/chakra-petch-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/chakra-petch-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/chakra-petch-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* `block` rather than `swap`: with the preloads above, each face is here
         before anything paints, so the block period costs nothing and no fallback
         is ever shown. `swap` is what draws the text twice. */
      @font-face {
        font-family: "DSEG14 Classic";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("/fonts/dseg14-classic-700.woff2") format("woff2");
      }
      /* The four weights src/index.scss sets body text at. Ahead of the
         @fontsource rules the bundle carries, which declare the same family with
         `swap`. A later rule for one family and weight wins, so those would put
         the swap back. src/index.tsx imports none of them for this reason. */
      @font-face {
        font-family: "Chakra Petch";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/chakra-petch-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Chakra Petch";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("/fonts/chakra-petch-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "Chakra Petch";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("/fonts/chakra-petch-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Chakra Petch";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("/fonts/chakra-petch-700.woff2") format("woff2");
      }
    </style>
    <!-- The saved theme, before the first paint. src/context/SettingsContext.tsx
         sets the same attribute once React is up, which is too late: a reader who
         chose dark on a light OS would see a light flash on every load. The key is
         the one src/utils/settingsStore.ts writes. -->
    <script>
      try {
        var theme = localStorage.getItem("rak-madness:settings:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // A browser refusing storage has no saved theme to honour anyway.
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
