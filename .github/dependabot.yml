# Dependabot opens the dependency update PRs, both the weekly version bumps and
# the fixes for an advisory.
#
# The PR title becomes the squash commit subject, so `prefix` spells a
# Conventional Commit type. `.github/workflows/pr-title.yml` skips bots, so
# nothing enforces it here.
#
# Groups match in the order listed, first match wins, so the catch-all is last.
# Each group below holds packages that constrain each other, through a peer
# range or through a shared release train. Those groups take every SemVer bump,
# majors included, because a coordinated major is exactly the case that must
# arrive as one PR. Everything else groups only minor and patch, which leaves a
# lone major to arrive by itself and get read on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Every install path runs `npm ci`, which takes the lockfile exactly and
    # ignores these ranges. So leave a range alone whenever it already admits
    # the new version, and let the lockfile carry the bump on its own.
    versioning-strategy: increase-if-necessary
    # Six version-update groups, plus a PR for each major outside one.
    # A security update is exempt from this limit and does not count toward it.
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # `.nvmrc` pins Node 22, and `check.yml` feeds that file to setup-node.
      # A major here would typecheck the code against a newer Node's
      # declarations than anything that runs it. Raise `.nvmrc` first, then
      # this range by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One advisory can reach several packages at once. Today's reached
      # js-yaml and, through wrangler and miniflare, sharp.
      security:
        applies-to: security-updates
        patterns: ["*"]

      # `@base-ui/react` and `@testing-library/react` both cap the React major
      # they accept, today `^19`. Leave either behind on a React major and the
      # peer range it declares no longer admits the react in the same PR.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@base-ui/react"
          - "@testing-library/*"

      # `eslint` and `@eslint/js` ship from one repo on one major. Alongside
      # them, `typescript-eslint` pins a `typescript` range, today
      # `>=4.8.4 <6.1.0`, so `typescript` moves in this group rather than as a
      # bump of its own.
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-plugin-*"
          - eslint-config-prettier
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"

      # `@vitejs/plugin-react` pins one `vite` major. Vitest accepts three, so
      # the plugin is what holds this group together.
      vite:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"

      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"

      # One release train, one version across all four faces.
      fontsource:
        patterns: ["@fontsource/*"]

      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
