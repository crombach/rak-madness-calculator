# Dependabot opens the dependency update PRs, both the weekly version bumps and
# the fixes for an advisory.
#
# The PR title becomes the squash commit subject, so `prefix` spells a
# Conventional Commit type. `.github/workflows/pr-title.yml` skips bots, so
# nothing enforces it here.
#
# Groups match in the order listed, first match wins, so the catch-all is last.
# Each group below is a set of packages that break each other when they move
# apart: a lint PR that lifted `eslint` without `@eslint/js` would fail
# `make check` on its own. Those groups take every SemVer bump, majors included,
# because a coordinated major is exactly the case that must arrive as one PR.
# Everything else groups only minor and patch, which leaves a lone major to
# arrive by itself and get read on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Seven groups, plus a PR for each major that falls outside one.
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # One advisory can reach several packages at once. Today's reached
      # js-yaml and, through wrangler and miniflare, sharp.
      security:
        applies-to: security-updates
        patterns: ["*"]

      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

      # `@eslint/js` tracks `eslint`, and `typescript-eslint` tracks its parser.
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-plugin-*"
          - eslint-config-prettier
          - typescript-eslint
          - "@typescript-eslint/*"

      # Vitest majors follow Vite majors.
      vite:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"

      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"

      testing-library:
        patterns: ["@testing-library/*"]

      # One release train, one version across all four faces.
      fontsource:
        patterns: ["@fontsource/*"]

      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
